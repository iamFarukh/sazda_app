<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Al-Qur'an Audio Player</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;family=Amiri:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e4e4cc",
                        "tertiary-fixed": "#fcdeba",
                        "on-tertiary-fixed-variant": "#574329",
                        "on-secondary-container": "#745c00",
                        "secondary-fixed": "#ffe088",
                        "on-primary": "#ffffff",
                        "surface-container-highest": "#e4e4cc",
                        "surface-container-high": "#eaead1",
                        "on-primary-container": "#80bea6",
                        "tertiary": "#3d2b13",
                        "primary": "#003527",
                        "inverse-on-surface": "#f2f2d9",
                        "on-secondary-fixed-variant": "#574500",
                        "tertiary-container": "#554127",
                        "secondary-container": "#fed65b",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#303221",
                        "background": "#fbfbe2",
                        "inverse-primary": "#95d3ba",
                        "surface-container-low": "#f5f5dc",
                        "surface": "#fbfbe2",
                        "outline": "#707974",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#281903",
                        "on-secondary-fixed": "#241a00",
                        "tertiary-fixed-dim": "#dfc29f",
                        "secondary": "#735c00",
                        "outline-variant": "#bfc9c3",
                        "surface-bright": "#fbfbe2",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#e9c349",
                        "on-primary-fixed-variant": "#0b513d",
                        "surface-container": "#efefd7",
                        "on-primary-fixed": "#002117",
                        "primary-fixed-dim": "#95d3ba",
                        "surface-tint": "#2b6954",
                        "on-tertiary-container": "#c9ae8c",
                        "on-surface": "#1b1d0e",
                        "on-background": "#1b1d0e",
                        "surface-dim": "#dbdcc3",
                        "primary-fixed": "#b0f0d6",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#064e3b",
                        "on-surface-variant": "#404944"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "body": ["Plus Jakarta Sans"],
                        "label": ["Plus Jakarta Sans"],
                        "arabic": ["Amiri"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-mesh {
            background-color: #fbfbe2;
            background-image: 
                radial-gradient(at 0% 0%, rgba(6, 78, 59, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(115, 92, 0, 0.05) 0px, transparent 50%);
        }
        .text-glow {
            text-shadow: 0 0 30px rgba(6, 78, 59, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface selection:bg-secondary-container/30">
<main class="min-h-screen flex flex-col bg-mesh relative overflow-hidden">
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-8 md:px-12">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest/50 backdrop-blur-md text-primary hover:bg-surface-container-lowest transition-colors shadow-sm">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline font-bold text-primary text-lg tracking-tight">Surah Al-Fatihah</h1>
<p class="font-body text-xs text-on-surface-variant tracking-widest uppercase mt-0.5">Mishary Rashid Alafasy</p>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest/50 backdrop-blur-md text-primary hover:bg-surface-container-lowest transition-colors shadow-sm">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<section class="flex-grow flex flex-col items-center justify-center px-8 md:px-24 pt-32 pb-48 text-center">
<div class="max-w-4xl w-full">
<div class="mb-12 relative">
<div class="absolute -top-24 left-1/2 -translate-x-1/2 opacity-5 w-64 h-64 pointer-events-none">
<svg class="fill-primary" viewbox="0 0 100 100">
<path d="M50 0L61.8 38.2H100L69.1 61.8L80.9 100L50 76.4L19.1 100L30.9 61.8L0 38.2H38.2L50 0Z"></path>
</svg>
</div>
<p class="font-arabic text-5xl md:text-7xl lg:text-8xl text-primary leading-[1.6] mb-12 text-glow" dir="rtl">
                        الرَّحْمَٰنِ الرَّحِيمِ
                    </p>
<div class="w-16 h-1 bg-secondary-container/40 mx-auto rounded-full mb-12"></div>
<p class="font-body text-xl md:text-2xl text-on-surface-variant font-medium leading-relaxed max-w-2xl mx-auto italic">
                        "The Most Compassionate, Most Merciful."
                    </p>
</div>
</div>
</section>
<footer class="fixed bottom-0 w-full z-50 px-6 pb-10 md:px-12 md:pb-16 bg-gradient-to-t from-surface via-surface/90 to-transparent">
<div class="max-w-2xl mx-auto">
<div class="mb-8">
<div class="relative h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="absolute top-0 left-0 h-full w-[26%] bg-primary-container rounded-full"></div>
<div class="absolute top-1/2 left-[26%] -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-primary-container border-4 border-surface rounded-full shadow-lg"></div>
</div>
<div class="flex justify-between items-center mt-3 px-1">
<span class="text-xs font-bold text-primary font-headline">0:12</span>
<span class="text-xs font-bold text-on-surface-variant font-headline">0:45</span>
</div>
</div>
<div class="flex items-center justify-center gap-8 md:gap-14">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="shuffle">shuffle</span>
</button>
<button class="w-14 h-14 flex items-center justify-center rounded-full bg-surface-container-low text-primary hover:bg-surface-container-high transition-all shadow-sm">
<span class="material-symbols-outlined text-4xl" data-icon="skip_previous">skip_previous</span>
</button>
<button class="w-24 h-24 flex items-center justify-center rounded-full bg-primary-container text-surface shadow-[0_20px_50px_rgba(6,78,59,0.3)] hover:scale-105 active:scale-95 transition-all">
<span class="material-symbols-outlined text-5xl" data-icon="pause" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="w-14 h-14 flex items-center justify-center rounded-full bg-surface-container-low text-primary hover:bg-surface-container-high transition-all shadow-sm">
<span class="material-symbols-outlined text-4xl" data-icon="skip_next">skip_next</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="repeat">repeat</span>
</button>
</div>
<div class="mt-10 flex justify-center items-center gap-6">
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-sm font-semibold hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="playlist_play">playlist_play</span>
                        Up Next
                    </button>
<button class="flex items-center gap-2 px-4 py-2 rounded-full bg-surface-container-low text-on-surface-variant text-sm font-semibold hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-lg" data-icon="share">share</span>
                        Share Ayah
                    </button>
</div>
</div>
</footer>
<div class="hidden lg:block absolute left-12 top-1/2 -translate-y-1/2">
<div class="flex flex-col gap-6 items-center">
<div class="w-px h-24 bg-gradient-to-b from-transparent via-outline-variant to-transparent opacity-20"></div>
<span class="rotate-180 [writing-mode:vertical-lr] text-[10px] uppercase tracking-[0.4em] text-on-surface-variant font-bold">The Digital Sanctuary</span>
<div class="w-px h-24 bg-gradient-to-b from-transparent via-outline-variant to-transparent opacity-20"></div>
</div>
</div>
</main>
<div class="md:hidden">
<nav class="fixed bottom-0 w-full rounded-t-xl z-50 bg-surface/80 backdrop-blur-xl flex justify-around items-center px-8 pb-6 pt-4 shadow-[0_-12px_40px_rgba(6,78,59,0.06)]">
<div class="flex flex-col items-center justify-center text-primary/50 p-3">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-headline text-[10px] uppercase tracking-widest mt-1">Read</span>
</div>
<div class="flex flex-col items-center justify-center bg-primary-container text-surface rounded-full p-3 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined" data-icon="headset" style="font-variation-settings: 'FILL' 1;">headset</span>
<span class="font-headline text-[10px] uppercase tracking-widest mt-1">Audio</span>
</div>
<div class="flex flex-col items-center justify-center text-primary/50 p-3">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-headline text-[10px] uppercase tracking-widest mt-1">Qibla</span>
</div>
<div class="flex flex-col items-center justify-center text-primary/50 p-3">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-headline text-[10px] uppercase tracking-widest mt-1">Settings</span>
</div>
</nav>
</div>
</body></html>
